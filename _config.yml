# Конфигурация Jekyll для Wiki

title: Моя Вики
description: База знаний и документация
baseurl: "/diffusers"
url: "https://wikitestt.github.io"

# Настройки сборки
markdown: kramdown
highlighter: rouge
permalink: /:basename.html

# Плагины (стандартные, без установки)
plugins:
  - jekyll-seo-tag

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Настройки навигации
navigation:
  - title: Главная
    url: /
  - title: Начало работы
    url: /getting-started
  - title: Руководства
    url: /guides
  - title: FAQ
    url: /faq
