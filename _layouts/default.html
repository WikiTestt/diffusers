<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">
                <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
            </h1>
            <nav class="main-nav">
                {% for item in site.navigation %}
                <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
                    {{ item.title }}
                </a>
                {% endfor %}
            </nav>
        </div>
    </header>

    <main class="site-content">
        <div class="container">
            <div class="content-wrapper">
                <!-- Левая боковая панель: навигация по страницам -->
                <aside class="sidebar-left">
                    <h3>Навигация</h3>
                    <nav class="sidebar-nav">
                        {% for item in site.navigation %}
                        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
                            {{ item.title }}
                        </a>
                        {% endfor %}
                    </nav>
                </aside>

                <!-- Основной контент -->
                <article class="page-content">
                    <h1 class="page-title">{{ page.title }}</h1>
                    {{ content }}
                </article>

                <!-- Правая боковая панель: оглавление -->
                <aside class="sidebar-right">
                    <h3>На этой странице</h3>
                    <nav class="toc" id="toc">
                        <!-- Оглавление генерируется JavaScript -->
                    </nav>
                </aside>
            </div>
        </div>
    </main>

    <script>
        // Генерация оглавления из заголовков h2 и h3
        document.addEventListener('DOMContentLoaded', function() {
            const content = document.querySelector('.page-content');
            const toc = document.getElementById('toc');
            const headings = content.querySelectorAll('h2, h3');

            if (headings.length === 0) {
                toc.innerHTML = '<p class="no-toc">Нет заголовков</p>';
                return;
            }

            headings.forEach((heading, index) => {
                // Добавляем ID к заголовку если его нет
                if (!heading.id) {
                    heading.id = 'heading-' + index;
                }

                // Создаём ссылку в оглавлении
                const link = document.createElement('a');
                link.href = '#' + heading.id;
                link.textContent = heading.textContent;
                link.className = heading.tagName.toLowerCase();
                toc.appendChild(link);

                // Плавная прокрутка
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                });
            });
        });
    </script>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 {{ site.title }}. {{ site.description }}</p>
        </div>
    </footer>
</body>
</html>
